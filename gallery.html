<!DOCTYPE html>

<!-- gallery.html bootstrap 4.5.3 grid layout adapted from official documentation:
https://getbootstrap.com/docs/4.5/layout/grid/
Image structure and figure captions adapted from:
https://developer.mozilla.org/en-US/docs/Web/HTML/Element/figure
JavaScript active link adapted from MDN querySelectorAll() and Bootstrap -->
<html lang="en">
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">

        <!-- bootstrap 4.5.3 css -->
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/css/bootstrap.min.css" integrity="sha384-TX8t27EcRE3e/ihU7zmQxVncDAy5uIKz4rEkgIXeMed4M0jlfIDPvg6uqKI2xXr2" crossorigin="anonymous">

        <!-- jquery/ bootstrap 4.5.3 js -->
        <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js" integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj" crossorigin="anonymous"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-ho+j7jyWK8fNQe+A12Hb8AhRq26LrZ/JpcUGGOn+Y7RsweNrtN/tE3MoK7ZeZDyx" crossorigin="anonymous"></script>

        <!-- CSS link -->
        <link href="styles.css" rel="stylesheet">
        <title>Gallery * My webpage</title>

    </head>

    <body>

        <!-- Navbar adapted from Bootstrap 4.5.3 Navbar example:https://getbootstrap.com/docs/4.5/components/navbar/ -->
        <nav class="navbar navbar-expand-md bg-white">
            <div class="container">
                <a class="navbar-brand fw-bold" href="index.html">My Web></a>

                <!-- Navbar toggle for small screens -->
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav"><span class="navbar-toggler-icon"></span></button>

                 <!-- Collapsible menu links -->
                <div id="nav" class="collapse navbar-collapse">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                        <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
                        <li class="nav-item"><a class="nav-link" href="projects.html">Projects</a></li>
                        <li class="nav-item"><a class="nav-link" href="gallery.html">Gallery</a></li>
                        <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
                    </ul>
                </div>
            </div>
        </nav>

        <!-- Main content: responsive image grid using Bootstrap's grid system -->
        <main class="container my-5">
            <header class="mb-4">
                <h1>Gallery</h1>
                <p class="text-muted">Pic grid with descriptions</p>
            </header>

            <!-- Grid system for 6 photos. Image URL copied via https://picsum.photos
			which delivers free samples. Layyout pattern adapted from Bootstrap grid and figure examples -->
            <section? class="row g-4">
                <!-- 6 pics/ figures-->
                <figure class="col-6 col-md-4">
                    <img class="w-100 rounded" src="https://picsum.photos/seed/g1/600/400" alt="Scenic 1" loading="lazy">
                    <figcaption class="mt-2 small text-muted">Photo 1</figcaption>
                </figure>
                <figure class="col-6 col-md-4">
                    <img class="w-100 rounded" src="https://picsum.photos/seed/g1/600/400" alt="Scenic 1" loading="lazy">
                    <figcaption class="mt-2 small text-muted">Photo 2</figcaption>
                </figure>
                <figure class="col-6 col-md-4">
                    <img class="w-100 rounded" src="https://picsum.photos/seed/g1/600/400" alt="Scenic 1" loading="lazy">
                    <figcaption class="mt-2 small text-muted">Photo 3</figcaption>
                </figure>
                <figure class="col-6 col-md-4">
                    <img class="w-100 rounded" src="https://picsum.photos/seed/g1/600/400" alt="Scenic 1" loading="lazy">
                    <figcaption class="mt-2 small text-muted">Photo 4</figcaption>
                </figure>
                <figure class="col-6 col-md-4">
                    <img class="w-100 rounded" src="https://picsum.photos/seed/g1/600/400" alt="Scenic 1" loading="lazy">
                    <figcaption class="mt-2 small text-muted">Photo 5</figcaption>
                </figure>
                <figure class="col-6 col-md-4">
                    <img class="w-100 rounded" src="https://picsum.photos/seed/g1/600/400" alt="Scenic 1" loading="lazy">
                    <figcaption class="mt-2 small text-muted">Photo 6</figcaption>
                </figure>
            </section>
        </main>

        <!-- Footer adapted from Bootstrap "Sticky Footer" example -->
        <footer class="container py-4 text-muted">
            <small>Got a question? Visit: <a href="about.html">About</a> page</small>
        </footer>

        <!-- JS: highlights the active nav link. Adapted from MDN querySelectorAll() and classList examples:
       https://developer.mozilla.org/en-US/docs/Web/API/Document/querySelectorAll
       https://developer.mozilla.org/en-US/docs/Web/API/Element/classList -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
        <script>
            const here = 'gallery.html';
            document.querySelectorAll('.nav-link').forEach(a => {
                if (a.getAttribute('href') === here) a.classList.add('active'), a.setAttribute('aria-current', 'page');
            });
        </script>
    </body>

</html>
