<!DOCTYPE html>

<!-- projects.html bootstrap 4.5.3 components adapted from official documentation:
https://getbootstrap.com/docs/4.5/getting-started/introduction/
Card layout inspired by Bootstrap "Card" examples and MDN image accessibility guidelines.
JavaScript pattern for highlighting the active nav link adapted from MDN querySelectorAll() documentation. -->
<html lang="em">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initia-scale=1">

        <!-- bootstrap 4.5.3 css -->
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/css/bootstrap.min.css" integrity="sha384-TX8t27EcRE3e/ihU7zmQxVncDAy5uIKz4rEkgIXeMed4M0jlfIDPvg6uqKI2xXr2" crossorigin="anonymous">

        <!-- jquery/ bootstrap 4.5.3 js -->
        <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js" integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj" crossorigin="anonymous"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-ho+j7jyWK8fNQe+A12Hb8AhRq26LrZ/JpcUGGOn+Y7RsweNrtN/tE3MoK7ZeZDyx" crossorigin="anonymous"></script>

        <!-- CSS link -->
        <link href="styles.css" rel="stylesheet">

        <title>Projects * My Webpage</title>
    </head>

    <body>

        <!-- Navbar adapted from Bootstrap 4.5.3:https://getbootstrap.com/docs/4.5/components/navbar/ -->
        <nav class="navbar navbar-expand-md bg-white">
            <div class="container">
                <a class="navbar-brand fw-bold" href="index.html">My Web</a>

                <!-- Navbar toggler for mobile view -->
                <button class="navbar-toggler" type="button" data-bs-toggler="collapse" data-bs-target="#nav"><span class="navbar-toggler-icon"></span></button>

                <!-- Collapsible navbar links -->
                <div id="nav" class="collapse navbar-collapse">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                        <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
                        <li class="nav-item"><a class="nav-link" href="projects.html">Projects</a></li>
                        <li class="nav-item"><a class="nav-link" href="gallery.html">Gallery</a></li>
                        <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
                    </ul>
                </div>
            </div>
        </nav>

        <!-- Main content: Bootstrap container for responsive layout -->
        <main class="container my-5">
            <header class="mb-4">
                <h1>Projects</h1>
                <p class="text-muted">A few sample projects</p>
            </header>


            <!-- 3-column responsive layout using Bootstrap grid -->
			<!-- Card component structure adapted from: https://getbootstrap.com/docs/4.5/components/card/ -->
            <section class="row g-4">
                <article class="col-md-4">
                    <div class="card h-100">

                        <!-- Random placeholder image from picsum.photos for demo -->
                        <img src="https://picsum.photos/seed/p1/600/400" alt="Abstract preview 1" class="card-img-top" loading="lazy">
                        <div class="card-body">
                            <h3 class="h5 card-title">Project A</h3>
                            <p class="card-text">Some text</p>
                            <a class="btn btn-sm btn-primary" href="contact.html">Ask me about it</a>
                        </div>
                    </div>
                </article>
                <article class="col-md-4">
                    <div class="card h-100">

                        <!-- Random placeholder image from picsum.photos for demo -->
                        <img src="https://picsum.photos/seed/p2/600/400" alt="Abstract preview 2" class="card-img-top" loading="lazy">
                        <div class="card-body">
                            <h3 class="h5 card-title">Project B</h3>
                            <p class="card-text">Image and button practice</p>
                            <a class="btn btn-sm btn-outline-secondary" href="gallery.html">See my Gallery</a>
                        </div>
                    </div>
                </article>
                <article class="col-md-4">
                    <div class="card h-100">

                        <!-- Random placeholder image from picsum.photos for demo -->
                        <img src="https://picsum.photos/seed/p3/600/400" alt="Abstract preview 3" class="card-img-top" loading="lazy">
                        <div class="card-body">
                            <h3 class="h5 card-title">Prohject C</h3>
                            <p class="card-text"> tired of typing href=""</p>
                            <a class="btn btn-sn btn-outine-primary" href="about.html">Learn more</a>
                        </div>
                    </div>
                </article>
            </section>
        </main>

        <!-- Footer adapted from Bootstrap "Sticky Footer" example -->
        <footer class="container py-4 text-muted">
            <small>Browse the <a href="gallery.html">Gallery</a> or head to <a href="contact.html">Contact</a></small>
        </footer>

        <!-- JavaScript: Highlight the active page link -->
		<!-- Adapted from MDN examples for querySelectorAll() and classList:
		    https://developer.mozilla.org/en-US/docs/Web/API/Document/querySelectorAll
	        https://developer.mozilla.org/en-US/docs/Web/API/Element/classList -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
        <script>
            const here = 'projects.html';
            document.querySelectorAll('.nav-link').forEach(a => {
                if (a.getAttribute('href') === here) a.classList.add('active'), a.setAttribute('aria-current', 'page');
            });
        </script>
    </body>

</html>
