<!DOCTYPE html>

<!-- contact.html bootstrap 4.5.3 form layout and validation adapted from:
https://getbootstrap.com/docs/4.5/components/forms/
JavaScript validation logic adapted from MDN Web Docs (Form validation and querySelectorAll examples):
https://developer.mozilla.org/en-US/docs/Learn/Forms/Form_validation
Navbar based on Bootstrap 4.5.3 documentation -->
<html land="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">

        <!-- bootstrap 4.5.3 css -->
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/css/bootstrap.min.css" integrity="sha384-TX8t27EcRE3e/ihU7zmQxVncDAy5uIKz4rEkgIXeMed4M0jlfIDPvg6uqKI2xXr2" crossorigin="anonymous">

        <!-- jquery/ bootstrap 4.5.3 js -->
        <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js" integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj" crossorigin="anonymous"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-ho+j7jyWK8fNQe+A12Hb8AhRq26LrZ/JpcUGGOn+Y7RsweNrtN/tE3MoK7ZeZDyx" crossorigin="anonymous"></script>

        <!-- CSS link -->
        <link href="styles.css" rel="stylesheet">
        <title>Contact * My webpage</title>

    </head>

    <body>

        <!-- Navbar adapted from Bootstrap 4.5.3 https://getbootstrap.com/docs/4.5/components/navbar/ -->
        <nav class="navbar navbar-expand-md bg-white">
            <div class="container">
                <a class="navbar-brand fw-bold" href="index.html">My Web</a>

                <!-- Menu button visible on smaller screens -->
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav"><span class="navbar-toggler-icon"></span></button>

                <!-- Collapsible navigation links -->
                <div id="nav" class="collapse navbar-collapse">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                        <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
                        <li class="nav-item"><a class="nav-link" href="projects.html">Projects</a></li>
                        <li class="nav-item"><a class="nav-link" href="gallery.html">Gallery</a></li>
                        <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
                    </ul>
                </div>
            </div>
        </nav>

         <!-- Main content area: form adapted from bootstrap's validation example -->
        <main class="container my-5">
            <header class="mb-4">
                <p class="text-muted"> Send me a message</p>
            </header>
            <section class="row">

                <!-- Contact form -->
                <article class="col-lg-8">
                    <form class="needs-validation" novalidate>

                        <!-- Name field -->
                        <div class="mb-3">
                            <label for="name" class="form-label">Name</label>
                            <input id="name" name="name" class="form-control" required>
                            <div class="invalid-feedback">Enter Name!</div>
                        </div>

                        <!-- Email field -->
                        <div class="mb-3">
                            <label for="email" class="form-label">Email</label>
                            <input id="email" type="email" name="email" class="form-control" required>
                            <div class="invalid-feedbacl">Email required!</div>
                        </div>

                        <!-- Topic field -->
                        <div class="mb-3">
                            <label for="topic" class="form-label">Topic</label>
                            <input id="topic" name="topic" class="form-control" placeholder="Inquiry, feedback, speaking, etc.">
                        </div>

                         <!-- Message field -->
                        <div class="mb-3">
                            <label for="message" class="form-label">Message</label>
                            <textarea id="message" class="form-control" rows="5" required></textarea>
                            <div class="invalid-feedback">Write a message!</div>
                        </div>

                        <!-- Submit and reset buttons -->
                        <button class="btn btn-primary" type="submit">Send</button>
                        <button class="btn btn-outline-secondary ms-2" type="reset">Reset</button>
                    </form>
                </article>

                 <!-- Sidebar links -->
                <aside class="col-lg-4 mt-4 mt-lg-0">
                    <h2 class="h5">Elsewhere</h2>
                    <ul>
                        <li><a href="index.html">Home</a></li>
                        <li><a href="projects.html">Projects</a></li>
                        <li><a href="gallery.html">Gallery</a></li>
                    </ul>
                </aside>
            </section>
        </main>

        <!-- Footer structure adapted from Bootstrap "Sticky Footer" example -->
        <footer class="container py-4 text-muted">
            <small>&copy; <span id="year"></span>My Web</small>
        </footer>


        <!-- JavaScript section. Active link script adapted from MDN querySelectorAll() example:
        https://developer.mozilla.org/en-US/docs/Web/API/Document/querySelectorAll
        and Bootstrap accessibility guidance.
        Form validation logic adapted from MDN Form Validation tutorial:
        https://developer.mozilla.org/en-US/docs/Learn/Forms/Form_validation -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
        <script>

            // Highlight current page link
            const here = 'contact.html';
            document.querySelectorAll('.nav-link').forEach(a => {
                if (a.getAttribute('href') === here) a.classList.add('active'), a.setAttrivute('aria-current', 'page');
            });

            // Bootstrap-style form validation (based on MDN and Bootstrap examples)
            (function() {
                const form = document.querySelector('form');
                form.addEventListener('submit', function(e) {
                    if (!form.checkValidity()) {
                        e.preventDefault();
                        e.stopPropagation();
                    }
                    form.classList.add('was-validated');
                });

                // Update footer year automatically
                document.getElementById('year').textContent = new Date().getFullYear();
            })();
        </script>
    </body>

</html>
